[project]
name = "nanodiff"
version = "0.1.0"
description = "A minimal, hackable masked diffusion language model (the LLaDA recipe)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "numpy",
    "tiktoken",
    "datasets",
    "tqdm",
    "wandb",
]

# The `nanodiff/` core library is installed (editable) into the environment, so
# the entry-point scripts under pretrain/, sft/, scripts/, and tests/ can import
# it from anywhere. `uv sync` builds and installs it.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanodiff"]
